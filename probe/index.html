<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>mobile-tty probe</title>

<style>
  :root { color-scheme: light dark; --fg:#111; --bg:#fff; --dim:#666; --hi:#0a7; --warn:#c40;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root { --fg:#eee; --bg:#111; --dim:#999; } }
  * { box-sizing: border-box; }
  html { margin:0; height:100%; overflow:hidden; }
  /* Sized from visualViewport, NOT height:100% — otherwise the bottom of the app
     lands underneath the iOS keyboard. This is the whole point of the exercise. */
  body { margin:0; position:fixed; top:0; left:0; width:100%; overflow:hidden;
    background:var(--bg); color:var(--fg); font:13px/1.35 ui-monospace, Menlo, monospace;
    -webkit-text-size-adjust:100%; display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  #stats { flex:0 0 auto; padding:6px 8px; border-bottom:1px solid var(--dim); }
  #stats b { color:var(--hi); font-weight:600; }
  #stats .w { color:var(--warn); }
  .row { display:flex; justify-content:space-between; gap:8px; }
  .row span:first-child { color:var(--dim); }
  #scroller { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:color-mix(in srgb, var(--fg) 4%, transparent); }
  #scroller div { padding:1px 8px; }
  #echo { flex:0 0 auto; padding:6px 8px; border-top:2px solid var(--hi); min-height:2.2em;
    word-break:break-all; background:color-mix(in srgb, var(--hi) 10%, transparent); }
  #caret { animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0 } }
  #log { flex:0 0 22%; overflow-y:auto; border-top:1px solid var(--dim); padding:4px 8px; color:var(--dim); }
  #sens { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:4px 8px;
    border-top:1px solid var(--dim); }
  #sens input { flex:1; }
  #bar { flex:0 0 auto; display:flex; gap:6px; padding:6px 8px 8px;
    border-top:1px solid var(--dim); }
  button { flex:1; padding:10px 4px; font:inherit; background:transparent; color:var(--fg);
    border:1px solid var(--dim); border-radius:6px; }
  #nub { position:fixed; right:10px; bottom:calc(90px + env(safe-area-inset-bottom));
    width:74px; height:74px; border-radius:50%; border:2px solid var(--hi);
    background:color-mix(in srgb, var(--hi) 18%, transparent); touch-action:none;
    display:flex; align-items:center; justify-content:center; font-size:11px; text-align:center; }
  #cap { position:absolute; left:-9999px; top:0; width:200px; height:40px; }
</style>

<div id="stats"></div>
<div id="scroller"></div>
<div id="echo"><span id="echotxt"></span><span id="caret">▊</span></div>
<div id="log"></div>
<div id="sens">
  <span>nub gain <b id="gv">1.0</b></span>
  <input id="gain" type="range" min="0.2" max="3" step="0.1" value="1">
</div>
<div id="bar">
  <button id="kb">keyboard</button>
  <button id="blur">blur</button>
  <button id="rep">send report</button>
  <button id="clr">clear</button>
</div>
<div id="nub">nub<br>drag me</div>
<textarea id="cap" autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="off"></textarea>

<script>
const $ = s => document.querySelector(s);
const stats = $('#stats'), logEl = $('#log'), scroller = $('#scroller'), cap = $('#cap');

// Fill the scroller so we can see whether scrolling still works with the keyboard up.
for (let i = 1; i <= 300; i++) {
  const d = document.createElement('div');
  d.textContent = String(i).padStart(3, '0') + '  ' + '─'.repeat(8) + ' line ' + i;
  scroller.appendChild(d);
}
scroller.scrollTop = scroller.scrollHeight;

let logN = 0;
function log(msg) {
  const t = (performance.now() / 1000).toFixed(2);
  logEl.insertAdjacentHTML('afterbegin', `<div>${t} ${msg}</div>`);
  if (++logN > 120) logEl.lastElementChild?.remove();
}

// Measure one monospace cell so we can report achievable cols/rows.
function cell(px) {
  const s = document.createElement('span');
  s.style.cssText = `position:absolute;visibility:hidden;font:${px}px/1.2 ui-monospace,Menlo,monospace`;
  s.textContent = 'M'.repeat(100);
  document.body.appendChild(s);
  const r = s.getBoundingClientRect();
  s.remove();
  return { w: r.width / 100, h: r.height };
}

const standalone = !!navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const inset = p => getComputedStyle(document.documentElement).getPropertyValue(p) || '0px';

// THE FIX: size the app to the visual viewport and follow its offset, so the bottom
// of the UI sits above the keyboard instead of underneath it.
function layout() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : innerHeight;
  const top = vv ? vv.offsetTop : 0;
  document.body.style.height = h + 'px';
  document.body.style.transform = `translateY(${top}px)`;
}

function render() {
  const vv = window.visualViewport;
  const iw = window.innerWidth, ih = window.innerHeight;
  const vh = vv ? vv.height : ih, vw = vv ? vv.width : iw;
  // Keyboard estimate: layout viewport minus visual viewport minus how far it was offset.
  const kb = Math.max(0, Math.round(ih - vh - (vv ? vv.offsetTop : 0)));
  const c13 = cell(13), c11 = cell(11);
  const cols = n => Math.floor(vw / n.w), rows = n => Math.floor(vh / n.h);

  const r = (a, b, cls) => `<div class="row"><span>${a}</span><span class="${cls||''}">${b}</span></div>`;
  stats.innerHTML =
    r('standalone', `<b>${standalone}</b>`) +
    r('innerHeight / visual.height', `${ih} / <b>${Math.round(vh)}</b>`) +
    r('visual offsetTop / pageTop', `${vv ? vv.offsetTop.toFixed(1) : '-'} / ${vv ? vv.pageTop.toFixed(1) : '-'}`) +
    r('visual scale', vv ? vv.scale.toFixed(3) : '-') +
    r('KEYBOARD (derived)', `<b>${kb}px</b>`, kb ? '' : 'w') +
    r('safe-area t/b', `${inset('--sat').trim()||'0px'} / ${inset('--sab').trim()||'0px'}`) +
    r('screen / dpr', `${screen.width}×${screen.height} @${devicePixelRatio}`) +
    r('orientation', (screen.orientation||{}).type || (innerWidth>innerHeight?'landscape':'portrait')) +
    r('grid @13px', `<b>${cols(c13)}×${rows(c13)}</b>  (cell ${c13.w.toFixed(2)}×${c13.h.toFixed(2)})`) +
    r('grid @11px', `${cols(c11)}×${rows(c11)}`) +
    r('scroller scrollTop', `${Math.round(scroller.scrollTop)} / ${scroller.scrollHeight}`);
}

// --- viewport + lifecycle events -------------------------------------------
if (window.visualViewport) {
  visualViewport.addEventListener('resize', () => {
    layout(); render();
    log(`visualViewport resize h=${Math.round(visualViewport.height)}`);
    report('vv-resize');
  });
  visualViewport.addEventListener('scroll', () => { layout(); render(); });
} else log('<b>no visualViewport API</b>');
addEventListener('resize', () => { layout(); render(); log(`window resize ${innerWidth}×${innerHeight}`); });
addEventListener('orientationchange', () => {
  log('orientationchange');
  setTimeout(() => { layout(); render(); report('rotate'); }, 300);
});
scroller.addEventListener('scroll', render, { passive: true });

// --- does the scroll container still work while the keyboard is up? --------
let lastTouch = 0;
scroller.addEventListener('touchmove', () => { if (Date.now() - lastTouch > 500) { log('scroller touchmove'); lastTouch = Date.now(); } }, { passive: true });

// --- hidden capture element: dictation + autocorrect ------------------------
$('#kb').onclick = () => { cap.focus(); log('focus() on hidden textarea'); };
$('#blur').onclick = () => { cap.blur(); log('blur()'); };
$('#clr').onclick = () => { logEl.innerHTML = ''; logN = 0; };
cap.addEventListener('beforeinput', e => {
  const warn = e.inputType === 'insertReplacementText';
  log(`${warn ? '<b class="w">AUTOCORRECT</b> ' : ''}beforeinput type=<b>${e.inputType}</b> data=${JSON.stringify(e.data)}`);
});
cap.addEventListener('input', e => {
  $('#echotxt').textContent = cap.value.slice(-160);
  log(`input type=${e.inputType} len=${cap.value.length}`);
});
cap.addEventListener('focus', () => log('hidden textarea FOCUS'));
cap.addEventListener('blur', () => log('hidden textarea BLUR'));

// --- fixed nub: does it get touches without the page/scroller moving? ------
const nub = $('#nub');
const DEAD = 14, MAXV = 45;           // px of slack, px/frame ceiling
let originY = null, dy = 0, moves = 0, raf = 0, gain = 1;

$('#gain').oninput = e => { gain = +e.target.value; $('#gv').textContent = gain.toFixed(1); };

// Displacement sets scroll SPEED, not distance. Softer than the first attempt:
// bigger dead zone, larger divisor, so small pulls creep instead of launching.
const velocity = d => {
  const m = Math.abs(d) - DEAD;
  if (m <= 0) return 0;
  return Math.sign(d) * Math.min(Math.pow(m / 14, 1.6) * gain, MAXV);
};

function tick() {
  const v = velocity(dy);
  if (v) scroller.scrollTop += v;
  nub.innerHTML = `dy ${dy}<br>${v ? (v > 0 ? '▼' : '▲') + Math.abs(Math.round(v)) : '·'}`;
  raf = requestAnimationFrame(tick);
}

nub.addEventListener('touchstart', e => {
  e.preventDefault();
  originY = e.touches[0].clientY; dy = 0; moves = 0;
  if (!raf) raf = requestAnimationFrame(tick);
  log('nub touchstart');
}, { passive: false });

nub.addEventListener('touchmove', e => {
  e.preventDefault();
  dy = Math.round(e.touches[0].clientY - originY);
  if (++moves % 12 === 0) log(`nub dy=${dy} v=${velocity(dy).toFixed(1)}`);
}, { passive: false });

const nubEnd = e => {
  e.preventDefault();
  cancelAnimationFrame(raf); raf = 0; dy = 0;
  nub.innerHTML = 'nub<br>drag me';
  log(`nub end after ${moves} moves`);
};
nub.addEventListener('touchend', nubEnd, { passive: false });
nub.addEventListener('touchcancel', nubEnd, { passive: false });

// --- reporting: POST metrics so they can be read off-device ----------------
let autocorrects = 0;
cap.addEventListener('beforeinput', e => { if (e.inputType === 'insertReplacementText') autocorrects++; });

function snapshot(tag) {
  const vv = window.visualViewport;
  const vh = vv ? vv.height : innerHeight, vw = vv ? vv.width : innerWidth;
  const c13 = cell(13);
  return {
    tag, standalone,
    innerH: innerHeight, visualH: Math.round(vh),
    offsetTop: vv ? +vv.offsetTop.toFixed(1) : null,
    scale: vv ? +vv.scale.toFixed(3) : null,
    keyboard: Math.max(0, Math.round(innerHeight - vh - (vv ? vv.offsetTop : 0))),
    grid13: `${Math.floor(vw / c13.w)}x${Math.floor(vh / c13.h)}`,
    cell: `${c13.w.toFixed(2)}x${c13.h.toFixed(2)}`,
    orientation: (screen.orientation || {}).type || null,
    dpr: devicePixelRatio, screen: `${screen.width}x${screen.height}`,
    safeTop: inset('--sat').trim(), safeBottom: inset('--sab').trim(),
    nubGain: gain, autocorrects, capturedLen: cap.value.length,
    ua: navigator.userAgent,
    log: [...logEl.querySelectorAll('div')].slice(0, 25).map(d => d.textContent),
  };
}

function report(tag) {
  const body = JSON.stringify(snapshot(tag));
  // keepalive so a report fired during backgrounding still lands
  fetch('/report', { method: 'POST', body, keepalive: true })
    .then(() => log(`reported <b>${tag}</b>`))
    .catch(err => log(`report FAILED ${err}`));
}
$('#rep').onclick = () => report('manual');

log(`start standalone=${standalone} ua=${navigator.userAgent.slice(0, 60)}`);
layout(); render();
setInterval(render, 500);
report('load');
if (new URLSearchParams(location.search).has('autofocus')) {
  setTimeout(() => { cap.focus(); log('autofocus'); }, 400);
}
</script>
