<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mobile-tty</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="pi">
<meta name="theme-color" content="#0b0b0d">
<meta name="build" content="%BUILD_ID%">
<style>/*%CSS%*/</style>
</head>
<body>
<!-- The shell the client fills in: terminal, key bar, menu, and the two
     overlays that report state a phone otherwise cannot show. -->
<div id="safe-probe"></div>
<span id="cell-probe">MMMMMMMMMM</span>

<pre id="diag-overlay" hidden></pre>

<div id="app">
  <div id="viewport">
    <div id="stage"><div id="screen"></div></div>
  </div>

  <div id="conn" hidden></div>
  <button id="to-bottom" hidden>↓ latest</button>

  <div id="bar">
    <div id="keys"></div>
    <div id="strip" hidden></div>
  </div>
</div>

<div id="menu" hidden>
  <div class="menu-card">
    <div class="menu-row"><span id="menu-state">connecting…</span><button data-act="close">Done</button></div>
    <div class="menu-head">Grid</div>
    <div class="menu-row" id="presets"></div>
    <div class="menu-head">Scroll</div>
    <div class="menu-row">
      <button data-act="top">⤒ Top</button>
      <button data-act="bottom">⤓ Bottom</button>
    </div>
    <div class="menu-head">Paste</div>
    <div class="menu-row">
      <input id="paste" type="text" placeholder="long-press here to paste"
             autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="off">
      <button data-act="send-paste">Send</button>
    </div>
    <div class="menu-head">Zoom <span id="scale-val"></span></div>
    <div class="menu-row">
      <button data-act="zoom-out">−</button>
      <button data-act="zoom-reset">100%</button>
      <button data-act="zoom-in">+</button>
    </div>
    <div class="menu-row"><button data-act="reconnect">Reconnect</button><button data-act="clear-view">Clear view</button></div>
    <div class="menu-row"><button data-act="reload">Reload app</button></div>
    <div class="menu-head">Diagnostics</div>
    <pre id="diag"></pre>
  </div>
</div>

<script type="module">/*%JS%*/</script>
</body>
</html>
